<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f7c59f">
<title>Spelling Adventure</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar" class="topbar" hidden>
      <button id="backBtn" class="icon-btn" aria-label="Go back">&#8592;</button>
      <h1 id="screenTitle" class="topbar-title">Spelling Adventure</h1>
      <div id="starCount" class="star-chip" aria-label="Stars"><span class="star-chip-icon">&#9733;</span><span id="starNum">0</span></div>
    </header>
    <main id="screen" class="screen" tabindex="-1"></main>
  </div>

  <div id="toastLayer" class="toast-layer" aria-live="polite"></div>

  <noscript>
    <p style="padding:2rem;font:1rem system-ui">Spelling Adventure needs JavaScript turned on.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
